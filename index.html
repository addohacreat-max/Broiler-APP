const SRC = [["visit", "طلب بيطري"], ["scheduled", "فحص مجدول"]], OUT = [["", "قيد الانتظار"], ["negative", "سلبي"], ["positive", "إيجابي"], ["suspect", "مشتبه"], ["other", "أخرى"]], LT = LAB.slice(1);

  const tabs = `<div class="row np">${[["tests", "📥 طلبات الفحص"], ["sched", "🗓️ الجدولة والبروتوكول"], ["lrep", "📋 تقرير المعمل"]].map(([k, l]) => `<button class="${lsub == k ? "" : "ghost"}" onclick="lsub='${k}';render()">${l}</button>`).join("")}</div>`;

    <div class="card" style="margin-top:10px"><div class="k">البيوت</div><div id="sh" style="display:flex;gap:14px;flex-wrap:wrap;margin-top:6px"></div></div>
    <div class="row" style="margin:10px 0"><button id="sa">➕ إضافة للجدول</button><button class="ghost" id="sg">⚙️ توليد الفحوصات حسب البروتوكول</button></div>
    <h2>بروتوكول الفحوصات</h2><div class="card hs">${sel("p1", "نوع الفحص", po(LT))}${inp("p2", "العمر (يوم)", "number")}${inp("p3", "ملاحظات")}</div><div class="row" style="margin:10px 0"><button id="pa">➕ إضافة للبروتوكول</button></div>
    <div class="card tw">${P.length ? `<table><tr><th>نوع الفحص</th><th>العمر (يوم)</th><th>ملاحظات</th><th></th></tr>${P.map(p => `<tr><td>${lbl(LAB, p.test_type)}</td><td>${p.at_age_days}</td><td>${esc(p.notes)}</td>${trash("lab_protocol", p.id)}</tr>`).join("")}</table>` : `<span class="k">لا يوجد بروتوكول بعد — أضف بنوده لاحقاً</span>`}</div>`;
    const lh = async () => { const {data} = await sb.from("houses").select("id,no").eq("cycle_id", $("#s2").value).gt("chicks", 0).order("no"); $("#sh").innerHTML = (data || []).map(h => `<label style="display:flex;gap:4px;align-items:center"><input type="checkbox" data-h="${h.id}" checked><span>عنبر ${h.no}</span></label>`).join(""); };

    $("#s1").onchange = fc; $("#s2").onchange = lh; await fc();
    const add = async rows => { if (!rows.length) return alert("لا توجد فحوصات جديدة للإضافة"); const {error} = await sb.from("lab_tests").insert(rows); if (error) return alert("❌ " + error.message); alert("✅ تمت إضافة الفحوصات"); lsub = "tests"; render(); };
