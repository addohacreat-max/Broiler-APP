.stp{display:flex;overflow-x:auto;padding:10px 0 4px}.stp .s{flex:1;min-width:92px;text-align:center;font-size:12px;position:relative}
.stp .s i{display:flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;margin:0 auto 6px;background:var(--bd);color:var(--tx);font-style:normal;font-weight:700;position:relative;z-index:1}
.stp .s::before{content:"";position:absolute;top:14px;inset-inline-start:-50%;width:100%;height:3px;background:var(--bd)}.stp .s:first-child::before{display:none}

    ${auto ? "" : `<button type="button" class="ghost" onclick="qEd('${r.id}')">✏️</button>`}<button type="button" class="ghost" onclick="del('quality_issues','${r.id}')">🗑</button></div></div>`; };
  const run = async () => {
